version: '3.9'

# AgentMesh — Full Local Development Stack
# Sunil Singh — Shards Inc / Shards Labs

services:

  # ── Core Infrastructure ────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: agentmesh-postgres
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentmesh

  redis:
    image: redis:7-alpine
    container_name: agentmesh-redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agentmesh

  # Message queue for high-throughput bot message routing
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: agentmesh-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: agentmesh
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentmesh

  # ── AgentMesh Services ─────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api-gateway
    container_name: agentmesh-api-gateway
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - DATABASE_URL=postgresql://agentmesh:${POSTGRES_PASSWORD:-agentmesh_dev_password}@postgres:5432/agentmesh
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      - RABBITMQ_URL=amqp://agentmesh:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
      - AGENTMESH_API_KEY=${AGENTMESH_API_KEY:-dev-api-key-change-in-prod}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-32-char-dev-encryption-key!!!!!}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api-gateway:/app/apps/api-gateway
      - ../../packages:/app/packages
    restart: unless-stopped
    networks:
      - agentmesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.agentmesh.local`)"

  bot-registry:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.bot-registry
    container_name: agentmesh-bot-registry
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DATABASE_URL=postgresql://agentmesh:${POSTGRES_PASSWORD:-agentmesh_dev_password}@postgres:5432/agentmesh
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-32-char-dev-encryption-key!!!!!}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agentmesh

  agent-runtime:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.agent-runtime
    container_name: agentmesh-agent-runtime
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3002
      - DATABASE_URL=postgresql://agentmesh:${POSTGRES_PASSWORD:-agentmesh_dev_password}@postgres:5432/agentmesh
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-50}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - agentmesh

  swarm-coordinator:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.swarm-coordinator
    container_name: agentmesh-swarm-coordinator
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3003
      - DATABASE_URL=postgresql://agentmesh:${POSTGRES_PASSWORD:-agentmesh_dev_password}@postgres:5432/agentmesh
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      - RABBITMQ_URL=amqp://agentmesh:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agentmesh

  # ── Admin Dashboard ─────────────────────────────────────────────────────────

  admin-dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin-dashboard
    container_name: agentmesh-admin
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000/events
    ports:
      - "3004:3000"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - agentmesh

  # ── Observability ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: agentmesh-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - agentmesh

  grafana:
    image: grafana/grafana:10.4.0
    container_name: agentmesh-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - agentmesh

  # Log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: agentmesh-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - agentmesh

  # ── Reverse Proxy ──────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.25-alpine
    container_name: agentmesh-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
      - admin-dashboard
    networks:
      - agentmesh

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  agentmesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
