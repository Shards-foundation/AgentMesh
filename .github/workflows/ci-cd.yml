name: AgentMesh CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Quality Gates ────────────────────────────────────────────────────────────
  
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint-typecheck]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentmesh_test
          POSTGRES_USER: agentmesh
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://agentmesh:test_password@localhost:5432/agentmesh_test
        run: pnpm db:migrate

      - name: Run tests
        env:
          DATABASE_URL: postgresql://agentmesh:test_password@localhost:5432/agentmesh_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: pnpm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ── Security Audit ─────────────────────────────────────────────────────────

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Run Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ── Build & Push Docker Images ─────────────────────────────────────────────

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      matrix:
        service:
          - api-gateway
          - bot-registry
          - agent-runtime
          - swarm-coordinator
          - admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE=${{ matrix.service }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

  # ── Deploy to Staging ──────────────────────────────────────────────────────

  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Run DB migrations
        run: |
          kubectl run db-migrate \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:${{ github.sha }} \
            --restart=Never \
            --env="DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" \
            --command -- pnpm db:migrate
          kubectl wait --for=condition=complete job/db-migrate --timeout=120s

      - name: Deploy services
        run: |
          export KUBECONFIG=kubeconfig.yaml
          export IMAGE_TAG=${{ github.sha }}
          envsubst < infrastructure/k8s/staging/kustomization.yaml | kubectl apply -f -

      - name: Verify deployment
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout status deployment/api-gateway -n agentmesh-staging --timeout=180s
          kubectl rollout status deployment/bot-registry -n agentmesh-staging --timeout=180s
          kubectl rollout status deployment/agent-runtime -n agentmesh-staging --timeout=180s

      - name: Run smoke tests
        run: |
          curl -f https://staging.agentmesh.io/health || exit 1

  # ── Deploy to Production ───────────────────────────────────────────────────

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Run DB migrations (production — with backup)
        run: |
          export KUBECONFIG=kubeconfig.yaml
          # Trigger backup before migration
          kubectl create job db-backup-${{ github.sha }} \
            --from=cronjob/db-backup -n agentmesh-production
          kubectl wait --for=condition=complete job/db-backup-${{ github.sha }} --timeout=300s

          # Run migration
          kubectl run db-migrate-prod \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:${{ github.sha }} \
            --restart=Never \
            --env="DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" \
            --command -- pnpm db:migrate
          kubectl wait --for=condition=complete pod/db-migrate-prod --timeout=180s

      - name: Blue-green deployment
        run: |
          export KUBECONFIG=kubeconfig.yaml
          export IMAGE_TAG=${{ github.sha }}
          kubectl apply -k infrastructure/k8s/production/

      - name: Verify production deployment
        run: |
          export KUBECONFIG=kubeconfig.yaml
          for svc in api-gateway bot-registry agent-runtime swarm-coordinator; do
            kubectl rollout status deployment/$svc -n agentmesh-production --timeout=300s
          done

      - name: Run production smoke tests
        run: |
          curl -f https://api.agentmesh.io/health || exit 1
          curl -f https://api.agentmesh.io/stats \
            -H "X-API-Key: ${{ secrets.PROD_SMOKE_TEST_API_KEY }}" || exit 1

      - name: Notify on success
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ AgentMesh deployed to production — SHA: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback on failure
        if: failure()
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout undo deployment/api-gateway -n agentmesh-production
          kubectl rollout undo deployment/bot-registry -n agentmesh-production
          kubectl rollout undo deployment/agent-runtime -n agentmesh-production
          kubectl rollout undo deployment/swarm-coordinator -n agentmesh-production
